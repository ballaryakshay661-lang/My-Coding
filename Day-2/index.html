<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="card">
        <h1>My API Explorer</h1>
        <p>Click the button to fetch data from a server.</p>

        <button id="loadButton">Fetch Sample Data</button>

        <p id="status" role="status">Ready to connect.</p>

        <section>
            <h2 id="postTitle">No post loaded</h2>
            <p id="postBody">Your fetched data will appear here.</p>
        </section>
    </main>
</body>
</html>
